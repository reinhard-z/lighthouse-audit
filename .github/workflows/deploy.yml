# Production deploy (SPEC.md §11). Manual dispatch from main only, approved
# through the `production` environment. The build job builds and tests once;
# the deploy job ships exactly that bundle without rebuilding; the verify job
# checks the live endpoint without the Cloudflare token and without Google.
# The PSI key is a Worker secret and never passes through GitHub.
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Refuse refs other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys run only from main (got ${GITHUB_REF})."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The only job that installs the full tree and runs (allowlisted) install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (mocked provider, workerd pool)
        run: pnpm test

      - name: Dry-run build
        run: pnpm build

      - name: Assemble the deployable bundle
        run: |
          mkdir -p deploy-bundle
          cp -R dist public wrangler.jsonc deploy-bundle/
          node -p "require('./package.json').devDependencies.wrangler" > deploy-bundle/WRANGLER_VERSION
          raw=$(wc -c < dist/index.js)
          echo "Worker bundle: ${raw} bytes (dist/index.js)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployable bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-bundle
          path: deploy-bundle
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy approved bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Refuse refs other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys run only from main (got ${GITHUB_REF})."
          exit 1

      - name: Download the deployable bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-bundle
          path: deploy-bundle

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Only Wrangler, at the version pinned in package.json, with install scripts disabled.
      - name: Install Wrangler
        run: |
          version=$(cat deploy-bundle/WRANGLER_VERSION)
          npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund "wrangler@${version}"

      # The prebuilt Worker is deployed with its static assets and custom-domain
      # route from the bundled wrangler.jsonc. RELEASE feeds /healthz and logs.
      - name: Deploy
        working-directory: deploy-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" deploy dist/index.js --no-bundle --var "RELEASE:${GITHUB_SHA}"

  verify:
    name: Post-deploy checks
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Plain Node, no dependency install, no Cloudflare token, no Google calls.
      - name: Check the deployed endpoint
        run: node scripts/post-deploy.ts --base-url https://audit.mrza.ch --release "${GITHUB_SHA}"
